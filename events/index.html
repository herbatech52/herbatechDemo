<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="pageTitle">Sự kiện | Herbatech</title>

  <meta name="description"
    content="Trang sự kiện của Herbatech: hoạt động nội bộ, hội thảo, workshop, và các sự kiện dành cho đối tác/khách hàng."
    id="metaDesc">

  <link rel="canonical" href="https://herbatech.com.vn/events" id="canonicalLink" />

  <meta property="og:site_name" content="Herbatech" />
  <meta property="og:title" content="Sự kiện | Herbatech" id="ogTitle" />
  <meta property="og:description"
    content="Cập nhật các sự kiện của Herbatech: hội thảo, workshop, hoạt động nội bộ, sự kiện đối tác." id="ogDesc" />
  <meta property="og:url" content="https://herbatech.com.vn/events" id="ogUrl" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://herbatech.com.vn/assets/img/design/dataannotation.jpg" id="ogImg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sự kiện | Herbatech" id="twTitle" />
  <meta name="twitter:description"
    content="Cập nhật các sự kiện của Herbatech: hội thảo, workshop, hoạt động nội bộ, sự kiện đối tác." id="twDesc" />
  <meta name="twitter:image" content="https://herbatech.com.vn/assets/img/design/dataannotation.jpg" id="twImg" />

  <!-- SEO JSON-LD (auto replace khi load detail) -->
  <script id="jsonldSchema" type="application/ld+json">
{
 "@context":"https://schema.org",
 "@type":"WebSite",
 "name":"Herbatech",
 "url":"https://herbatech.com.vn/events"
}
</script>

  <link href="/assets/img/logo/HerbatechLogo.png" rel="shortcut icon" type="image/png" />
  <link href="/dist/styles.css" rel="stylesheet" />

  <style>
    :root {
      --header-offset: 96px;
    }

    [id] {
      scroll-margin-top: var(--header-offset);
    }
  </style>
</head>

<body class="bg-white">
  <div id="header"></div>

  <main id="page-content" style="padding-top:var(--header-offset);">

    <!-- ================= LIST ================= -->
    <div id="listPage">
      <section class="max-w-6xl mx-auto px-6 pt-14 pb-10">
        <h1 class="text-3xl md:text-4xl font-bold">Sự kiện Herbatech</h1>
        <p class="text-gray-600 mt-3 max-w-2xl">
          Cập nhật hoạt động nội bộ, hội thảo, workshop và sự kiện dành cho đối tác.
        </p>
      </section>

      <section class="max-w-6xl mx-auto px-6 pb-10">
        <div id="featuredEvent"></div>
      </section>

      <section class="max-w-6xl mx-auto px-6 pb-16">
        <div id="eventsGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        <div id="emptyText" class="hidden text-sm text-gray-500 mt-6"></div>
      </section>
    </div>

    <!-- ================= DETAIL ================= -->
    <div id="detailPage" class="hidden">
      <section class="max-w-3xl mx-auto px-6 pt-14 pb-14">

        <div id="detailLoading">Đang tải sự kiện...</div>

        <div id="detailNotFound" class="hidden">
          <h1 class="text-2xl font-bold">Không tìm thấy sự kiện</h1>
          <a href="/events/" class="text-[#20CFCF] font-semibold mt-4 inline-block">
            ← Quay lại danh sách sự kiện
          </a>
        </div>

        <article id="detailContent" class="hidden">

          <div class="text-sm text-gray-500 flex gap-2">
            <span id="dDate"></span>
            <span>•</span>
            <span id="dCategory"></span>
            <span>•</span>
            <span id="dMinutes"></span>
          </div>

          <h1 id="dTitle" class="text-3xl md:text-4xl font-bold mt-3"></h1>

          <p id="dExcerpt" class="text-gray-600 mt-3"></p>

          <div id="dBody" class="prose max-w-none mt-8"></div>

          <a href="/events/" class="inline-block mt-10 text-[#20CFCF] font-semibold">
            ← Quay lại danh sách sự kiện
          </a>

        </article>
      </section>
    </div>

  </main>

  <div id="footer"></div>

  <script>
    const CMS_BASE = "https://herbatech-cms.onrender.com";

    function getParam(name) {
      const url = new URL(location.href);
      return (url.searchParams.get(name) || "").trim();
    }

    function formatDateVN(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleDateString("vi-VN");
    }

    /* ================= SEO ULTIMATE ================= */
    function setMetaForDetail({ title, excerpt, slug, cover, created_at, category }) {

      const t = title + " | Herbatech";
      const d = excerpt || "Sự kiện Herbatech";
      const url = `https://herbatech.com.vn/events/?slug=${slug}`;

      document.title = t;
      metaDesc.setAttribute("content", d);
      canonicalLink.setAttribute("href", url);

      ogTitle.content = t;
      ogDesc.content = d;
      ogUrl.content = url;
      twTitle.content = t;
      twDesc.content = d;

      if (cover) {
        ogImg.content = cover;
        twImg.content = cover;
      }

      /* JSON-LD EVENT */
      const schema = {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": title,
        "description": d,
        "startDate": created_at || "",
        "eventAttendanceMode": "https://schema.org/OnlineEventAttendanceMode",
        "eventStatus": "https://schema.org/EventScheduled",
        "organizer": {
          "@type": "Organization",
          "name": "Herbatech",
          "url": "https://herbatech.com.vn"
        },
        "url": url,
        "image": cover || ""
      };

      document.getElementById("jsonldSchema").textContent =
        JSON.stringify(schema, null, 2);
    }

    /* ================= LIST ================= */

    const featuredEventEl = document.getElementById("featuredEvent");
    const eventsGridEl = document.getElementById("eventsGrid");
    const emptyTextEl = document.getElementById("emptyText");

    function eventHref(slug) {
      return `/events/?slug=${encodeURIComponent(slug)}`;
    }

    function renderFeatured(item) {
      if (!item) { featuredEventEl.innerHTML = ""; return; }

      featuredEventEl.innerHTML = `
<a href="${eventHref(item.slug)}"
class="group grid md:grid-cols-2 border rounded-2xl overflow-hidden hover:shadow-lg">
<img src="${item.cover || ""}" class="w-full h-full object-cover min-h-[240px]">
<div class="p-6">
<h2 class="text-2xl font-bold">${item.title}</h2>
<p class="text-gray-600 mt-3">${item.excerpt || ""}</p>
</div>
</a>`;
    }

    function renderGrid(items, featuredSlug) {
      eventsGridEl.innerHTML = items
        .filter(x => x.slug !== featuredSlug)
        .map(ev => `
<a href="${eventHref(ev.slug)}"
class="block border rounded-xl overflow-hidden hover:shadow-lg">
<img src="${ev.cover || ""}" class="w-full h-44 object-cover">
<div class="p-4">
<h3 class="font-bold">${ev.title}</h3>
<p class="text-sm text-gray-600 mt-2">${ev.excerpt || ""}</p>
</div>
</a>`).join("");
    }

    async function loadList() {
      document.title = "Sự kiện | Herbatech";
      canonicalLink.href = "https://herbatech.com.vn/events";

      const res = await fetch(`${CMS_BASE}/api/events`);
      let items = await res.json();

      if (!items.length) {
        emptyTextEl.classList.remove("hidden");
        return;
      }

      const featured = items.find(x => x.is_featured) || items[0];
      renderFeatured(featured);
      renderGrid(items, featured.slug);
    }

    /* ================= DETAIL ================= */

    const listPage = document.getElementById("listPage");
    const detailPage = document.getElementById("detailPage");

    const dLoading = document.getElementById("detailLoading");
    const dNotFound = document.getElementById("detailNotFound");
    const dContent = document.getElementById("detailContent");

    const dDate = document.getElementById("dDate");
    const dCategory = document.getElementById("dCategory");
    const dMinutes = document.getElementById("dMinutes");
    const dTitle = document.getElementById("dTitle");
    const dExcerpt = document.getElementById("dExcerpt");
    const dBody = document.getElementById("dBody");

    async function loadDetail(slug) {

      listPage.classList.add("hidden");
      detailPage.classList.remove("hidden");

      try {
        const res = await fetch(`${CMS_BASE}/api/events/slug/${slug}`);
        if (!res.ok) throw 0;

        const data = await res.json();

        setMetaForDetail({
          title: data.title,
          excerpt: data.excerpt,
          slug,
          cover: data.cover,
          created_at: data.created_at,
          category: data.category
        });

        dDate.textContent = formatDateVN(data.created_at);
        dCategory.textContent = data.category || "Sự kiện";
        dMinutes.textContent = (data.reading_minutes || 5) + " phút";
        dTitle.textContent = data.title;
        dExcerpt.textContent = data.excerpt || "";
        dBody.innerHTML = data.content || "";

        dLoading.classList.add("hidden");
        dContent.classList.remove("hidden");

      } catch (e) {
        dLoading.classList.add("hidden");
        dNotFound.classList.remove("hidden");
      }
    }

    /* ================= BOOT ================= */

    (function boot() {
      const slug = getParam("slug");
      if (slug) loadDetail(slug);
      else loadList();
    })();
  </script>
</body>

</html>

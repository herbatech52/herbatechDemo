<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Liên hệ Herbatech - Hỗ trợ & Tư vấn giải pháp AI</title>
  <meta name="description"
    content="Liên hệ Herbatech để được tư vấn giải pháp AI, xử lý dữ liệu, gán nhãn, kiểm thử và nhận diện hình ảnh.">
  <link rel="canonical" href="https://herbatech.com.vn/contact" />

  <meta property="og:site_name" content="Herbatech" />
  <meta property="og:title" content="Liên hệ Herbatech - Hỗ trợ & Tư vấn giải pháp AI" />
  <meta property="og:description"
    content="Đội ngũ Herbatech sẵn sàng hỗ trợ và tư vấn giải pháp AI phù hợp nhu cầu doanh nghiệp." />
  <meta property="og:url" content="https://herbatech.com.vn/contact" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://herbatech.com.vn/assets/img/design/contact.jpg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Liên hệ Herbatech - Hỗ trợ & Tư vấn giải pháp AI" />
  <meta name="twitter:description"
    content="Đội ngũ Herbatech sẵn sàng hỗ trợ và tư vấn giải pháp AI phù hợp nhu cầu doanh nghiệp." />
  <meta name="twitter:image" content="https://herbatech.com.vn/assets/img/design/contact.jpg" />

  <link href="/assets/img/logo/HerbatechLogo.png" rel="shortcut icon" type="image/png" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <link href="/dist/styles.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>

<body>
  <div class="fixed inset-0 -z-10" id="particles-js"></div>
  <div id="header"></div>

  <section class="text-black max-w-7xl mx-auto px-4 py-24 mt-20 grid grid-cols-1 md:grid-cols-2 gap-12">
    <div>
      <h1 class="text-3xl font-bold mb-4"><span class="text-[#20CFCF]">Herba</span><span
          class="text-[#444444]">tech</span></h1>
      <p class="mb-6">Để có thêm thông tin về các dịch vụ của chúng tôi:</p>
      <ul class="space-y-4 text-sm">
        <li><i class="fas fa-map-marker-alt mr-2 text-[#20CFCF]"></i>Địa chỉ: Tầng 4, liền kề 3 dự án Dolphin plaza, số
          28 Trần Bình, Mai Dịch, Cầu Giấy, Hà Nội</li>
        <li><i class="fas fa-phone mr-2 text-[#20CFCF]"></i>Hotline: 0967.671.592</li>
        <li><i class="fas fa-envelope mr-2 text-[#20CFCF]"></i>Email: herbatechnology.hbt@gmail.com</li>
        <div class="mt-4 w-full h-48 rounded overflow-hidden shadow">
          <iframe class="w-full h-full"
            src="https://www.google.com/maps?q=28+Trần+Bình,+Nam+Từ+Liêm,+Hà+Nội&z=16&output=embed" allowfullscreen=""
            loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

      </ul>
    </div>

    <form id="contact-form" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-100 p-6 rounded-lg shadow"
      method="POST" novalidate>
      <div>
        <label class="block text-sm font-semibold mb-1">Tên <span class="text-red-500">*</span></label>
        <input name="first_name" type="text" class="w-full border border-gray-300 rounded px-3 py-2" required />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Họ <span class="text-red-500">*</span></label>
        <input name="last_name" type="text" class="w-full border border-gray-300 rounded px-3 py-2" required />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Vị trí <span class="text-red-500">*</span></label>
        <input name="title" type="text" class="w-full border border-gray-300 rounded px-3 py-2" required />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Công ty <span class="text-red-500">*</span></label>
        <input name="company" type="text" class="w-full border border-gray-300 rounded px-3 py-2" required />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Email doanh nghiệp <span class="text-red-500">*</span></label>
        <input name="work_email" type="email" class="w-full border border-gray-300 rounded px-3 py-2" required />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Số điện thoại <span class="text-red-500">*</span></label>
        <input name="phone" type="tel" class="w-full border border-gray-300 rounded px-3 py-2" required />
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Bạn tìm thấy chúng tôi qua? <span
            class="text-red-500">*</span></label>
        <select name="hear_about" class="w-full border border-gray-300 rounded px-3 py-2" required>
          <option value="">Vui lòng chọn</option>
          <option>Google</option>
          <option>Facebook</option>
          <option>Khác</option>
        </select>
      </div>
      <div class="md:col-span-2">
        <label class="block text-sm font-semibold mb-1">Để lại lời nhắn cho chúng tôi <span
            class="text-red-500">*</span></label>
        <textarea name="message" rows="4" class="w-full border border-gray-300 rounded px-3 py-2" required></textarea>
      </div>
      <div class="md:col-span-2 text-right">
        <button type="submit" class="bg-[#20CFCF] hover:bg-[#1ab2b2] text-white px-6 py-2 rounded font-semibold">
          Gửi thông tin
        </button>
      </div>
    </form>
  </section>

  <div id="footer"></div>

  <div style="display:none">
    <iframe class="w-full h-full border-0"
      src="https://www.google.com/maps?q=21.030562427650597,105.77601337925196&z=15&output=embed" allowfullscreen=""
      loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>

  <script src="/include.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js" defer></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="/assets/js/contactEmail.js"></script>
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/menu.js" defer></script>
</body>

</html>
